{{ define "global/base" }}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1e2a5e">
    <title>{{if .Title}}{{.Title}}{{else if .EditionName}}{{.EditionName}} ई-पेपर — हिंदुस्तान{{else}}हिंदुस्तान ई-पेपर{{end}}</title>
    <meta name="description" content="हिंदुस्तान ई-पेपर के सभी संस्करण एक ही जगह — ऑनलाइन पढ़ें या पूरा पीडीएफ़ डाउनलोड करें।">
    <meta name="google-site-verification" content="aDk55QFSwwnIZ6PQjJE-dYWdEPZpqPNmwMfJwCpwEqI" />

    <!-- Set theme before first paint so there's no flash of the wrong colour scheme -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('hnd-theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/bootstrap.css">
    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">

    <style>
        :root{
            --font-body:'Noto Sans','Noto Sans Devanagari',system-ui,-apple-system,sans-serif;
            --font-display:'Poppins','Noto Sans Devanagari',sans-serif;

            --bg:#f6f5f0;
            --bg-soft:#eeece4;
            --surface:#ffffff;
            --text:#1b1c26;
            --text-muted:#6b6c7a;
            --border:#e5e3da;

            --primary:#1e2a5e;
            --primary-2:#2f3d82;
            --accent:#ff7a1a;
            --accent-2:#0e9f6e;

            --shadow-sm:0 2px 8px rgba(20,20,45,.06);
            --shadow:0 10px 30px rgba(20,20,45,.09);
            --shadow-lg:0 24px 60px rgba(20,20,45,.16);

            --radius-sm:10px;
            --radius:16px;
            --radius-lg:26px;
            --radius-pill:999px;
        }

        [data-theme="dark"]{
            --bg:#0f1119;
            --bg-soft:#151827;
            --surface:#181c2c;
            --text:#eef0f8;
            --text-muted:#9396ab;
            --border:#272c42;

            --primary:#8b9bff;
            --primary-2:#6b7bf0;
            --accent:#ffab5c;
            --accent-2:#3ddc9a;

            --shadow-sm:0 2px 10px rgba(0,0,0,.35);
            --shadow:0 14px 34px rgba(0,0,0,.45);
            --shadow-lg:0 30px 70px rgba(0,0,0,.6);
        }

        *,*::before,*::after{box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{
            margin:0;
            font-family:var(--font-body);
            background:var(--bg);
            color:var(--text);
            -webkit-font-smoothing:antialiased;
            transition:background .25s ease,color .25s ease;
            min-height:100vh;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            z-index:-1;
            background:
                radial-gradient(600px 400px at 8% -5%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
                radial-gradient(700px 500px at 110% 10%, color-mix(in srgb, var(--primary) 20%, transparent), transparent 70%);
            pointer-events:none;
        }
        a{color:inherit;text-decoration:none;}
        img{max-width:100%;display:block;}
        ::selection{background:var(--accent);color:#fff;}

        .container{max-width:1180px;margin:0 auto;padding:0 20px;}

        /* ---------- Navbar ---------- */
        .site-nav{
            position:sticky;top:0;z-index:50;
            backdrop-filter:blur(14px) saturate(160%);
            background:color-mix(in srgb, var(--bg) 78%, transparent);
            border-bottom:1px solid var(--border);
        }
        .site-nav-inner{
            max-width:1180px;margin:0 auto;padding:14px 20px;
            display:flex;align-items:center;justify-content:space-between;gap:12px;
        }
        .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--text);}
        .brand-mark{
            display:grid;place-items:center;width:38px;height:38px;border-radius:12px;
            background:linear-gradient(145deg,var(--primary),var(--primary-2));
            color:#fff;font-size:1.1rem;box-shadow:var(--shadow-sm);
        }
        .nav-actions{display:flex;align-items:center;gap:8px;}
        .theme-toggle{
            width:40px;height:40px;border-radius:var(--radius-pill);border:1px solid var(--border);
            background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:1.1rem;
            transition:transform .2s ease,box-shadow .2s ease;
        }
        .theme-toggle:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}

        /* ---------- Buttons ---------- */
        .btn{
            display:inline-flex;align-items:center;gap:8px;
            padding:10px 18px;border-radius:var(--radius-pill);
            font-weight:600;font-size:.92rem;border:1px solid transparent;cursor:pointer;
            transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
            white-space:nowrap;
        }
        .btn:hover{transform:translateY(-2px);}
        .btn-primary{background:linear-gradient(135deg,var(--accent),#ff9142);color:#fff;box-shadow:0 10px 24px color-mix(in srgb, var(--accent) 45%, transparent);}
        .btn-primary:hover{box-shadow:0 14px 30px color-mix(in srgb, var(--accent) 55%, transparent);}
        .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text);}
        .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
        .btn-sm{padding:7px 12px;font-size:.82rem;}
        .icon-btn{
            width:36px;height:36px;border-radius:var(--radius-pill);
            display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);
            cursor:pointer;transition:transform .18s ease,background .18s ease,color .18s ease;flex-shrink:0;
        }

        /* ---------- Hero ---------- */
        .hero{padding:64px 0 36px;text-align:center;}
        .eyebrow{
            display:inline-block;font-family:var(--font-display);font-weight:600;font-size:.8rem;
            letter-spacing:.08em;color:var(--accent);background:color-mix(in srgb, var(--accent) 14%, transparent);
            padding:6px 14px;border-radius:var(--radius-pill);margin-bottom:16px;
        }
        .hero h1{
            font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,4vw,2.7rem);
            margin:0 0 12px;line-height:1.25;
        }
        .hero p{color:var(--text-muted);max-width:560px;margin:0 auto;font-size:1.02rem;}

        .stat-bar{display:flex;justify-content:center;gap:28px;margin-top:26px;flex-wrap:wrap;}
        .stat{text-align:center;}
        .stat b{display:block;font-family:var(--font-display);font-size:1.5rem;color:var(--primary);}
        .stat span{font-size:.8rem;color:var(--text-muted);}

        /* ---------- Search ---------- */
        .search-wrap{max-width:480px;margin:28px auto 8px;position:relative;}
        .search-wrap input{
            width:100%;padding:13px 44px 13px 44px;border-radius:var(--radius-pill);
            border:1px solid var(--border);background:var(--surface);color:var(--text);
            font-family:var(--font-body);font-size:.95rem;outline:none;
            transition:box-shadow .2s ease,border-color .2s ease;
        }
        .search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);}
        .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5;}
        .search-clear{
            position:absolute;right:8px;top:50%;transform:translateY(-50%);
            width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-soft);
            color:var(--text-muted);cursor:pointer;display:none;font-size:.9rem;
        }
        .search-wrap.has-value .search-clear{display:block;}
        #noResults{text-align:center;color:var(--text-muted);padding:40px 0;display:none;}

        /* ---------- State sections ---------- */
        .state-section{margin:44px 0;animation:rise .5s ease both;}
        .state-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
        .state-head h2{
            font-family:var(--font-display);font-weight:700;font-size:1.25rem;color:var(--primary);
            margin:0;white-space:nowrap;
        }
        .state-head::after{content:"";flex:1;height:1px;background:var(--border);}

        .city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
        .city-card{
            background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
            padding:16px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease;
        }
        .city-card:hover{transform:translateY(-4px);box-shadow:var(--shadow);}
        .city-name{
            font-weight:700;font-size:.95rem;margin:0 0 12px;padding-bottom:10px;
            border-bottom:1px dashed var(--border);color:var(--text);
            display:flex;align-items:center;gap:8px;
        }
        .city-name::before{content:"📍";font-size:.9rem;}

        .edition-chip{
            display:flex;align-items:center;justify-content:space-between;gap:8px;
            padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:6px;
            background:var(--bg-soft);transition:background .18s ease;
        }
        .edition-chip:last-child{margin-bottom:0;}
        .edition-chip:hover{background:color-mix(in srgb, var(--primary) 10%, var(--bg-soft));}
        .chip-name{font-size:.88rem;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .chip-actions{display:flex;gap:6px;flex-shrink:0;}
        .chip-btn{
            width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
            color:var(--text-muted);transition:background .18s ease,color .18s ease,transform .18s ease;
        }
        .chip-btn:hover{transform:translateY(-1px);}
        .chip-btn.view:hover{background:color-mix(in srgb, var(--primary) 16%, transparent);color:var(--primary);}
        .chip-btn.download:hover{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent);}
        .chip-btn svg{width:16px;height:16px;}

        @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

        /* Visually hidden but still readable by search engines / screen readers */
        .sr-only{
            position:absolute;width:1px;height:1px;padding:0;margin:-1px;
            overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
        }

        /* ---------- Footer ---------- */
        .site-footer{margin-top:70px;border-top:1px solid var(--border);padding:28px 0;text-align:center;color:var(--text-muted);font-size:.85rem;}
        .site-footer a{color:var(--primary);font-weight:600;}

        /* ---------- Toast ---------- */
        .toast{
            position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
            background:var(--primary);color:#fff;padding:12px 20px;border-radius:var(--radius-pill);
            box-shadow:var(--shadow-lg);font-size:.88rem;display:flex;align-items:center;gap:10px;
            opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:200;
        }
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
        .toast .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;flex-shrink:0;}
        @keyframes spin{to{transform:rotate(360deg);}}

        /* ---------- Gallery (image.html) ---------- */
        .back-link{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text-muted);margin:22px 0 0;}
        .back-link:hover{color:var(--primary);}
        .gallery-header{
            display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
            padding:16px 0 26px;border-bottom:1px solid var(--border);margin-bottom:28px;
        }
        .gallery-title h1{font-family:var(--font-display);font-size:clamp(1.3rem,3vw,1.9rem);margin:0 0 4px;}
        .gallery-title span{color:var(--text-muted);font-size:.88rem;}

        .page-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding-bottom:60px;counter-reset:pagenum;}
        .page-card{
            counter-increment:pagenum;
            cursor:zoom-in;border-radius:var(--radius);overflow:hidden;background:var(--surface);
            border:1px solid var(--border);box-shadow:var(--shadow-sm);
            transition:transform .22s ease,box-shadow .22s ease;position:relative;
        }
        .page-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
        .page-card img{aspect-ratio:3/4.7;object-fit:cover;background:var(--bg-soft);width:100%;}
        .page-num{
            position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;
            font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);backdrop-filter:blur(4px);
        }
        .page-num::after{content:counter(pagenum);}

        /* ---------- Lightbox ---------- */
        .lightbox{
            position:fixed;inset:0;background:rgba(5,6,12,.92);backdrop-filter:blur(6px);
            display:none;align-items:center;justify-content:center;z-index:300;padding:24px;
        }
        .lightbox.open{display:flex;animation:fadeIn .2s ease;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .lightbox img{max-width:min(92vw,900px);max-height:88vh;border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);}
        .lightbox-close,.lightbox-nav{
            position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
            color:#fff;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
            cursor:pointer;transition:background .18s ease;font-size:1.2rem;line-height:1;
        }
        .lightbox-close:hover,.lightbox-nav:hover{background:rgba(255,255,255,.2);}
        .lightbox-close{top:20px;right:20px;}
        .lightbox-prev{left:20px;top:50%;transform:translateY(-50%);}
        .lightbox-next{right:20px;top:50%;transform:translateY(-50%);}
        .lightbox-counter{
            position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
            color:#fff;font-size:.85rem;background:rgba(255,255,255,.1);padding:6px 16px;border-radius:var(--radius-pill);
        }
        @media (max-width:640px){
            .lightbox-prev,.lightbox-next{width:38px;height:38px;}
            .lightbox-prev{left:8px;}.lightbox-next{right:8px;}
        }
    </style>
</head>
{{ end }}
